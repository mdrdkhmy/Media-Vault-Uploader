kind = "web"
previewPath = "/"
title = "Media Vault"
description = "A polished full-stack media vault for uploading images, PDFs, and videos, with persistent storage, public links, previews, copy actions, and permanent deletion."
version = "1.0.0"
id = "artifacts/media-vault"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24475

[services.development]
run = "pnpm --filter @workspace/media-vault run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/media-vault", "run", "build" ]
serve = "static"
publicDir = "artifacts/media-vault/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24475"
BASE_PATH = "/"
