[build]
  command = "pnpm --filter @workspace/media-vault run build"
  publish = "artifacts/media-vault/dist/public"
  functions = "artifacts/media-vault/netlify/functions"

[build.environment]
  BASE_PATH = "/"
  PORT = "8888"
  NODE_VERSION = "20"
  PNPM_VERSION = "10.28.2"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200